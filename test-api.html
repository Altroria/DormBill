<!DOCTYPE html>
<html>
<head>
    <title>API测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow: auto; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>电表API测试</h1>
    
    <div>
        <button onclick="testAPI1()">测试1: 查询7月所有数据</button>
        <button onclick="testAPI2()">测试2: 查询7月二号楼数据 (building_id=1)</button>
        <button onclick="testAPI3()">测试3: 查询8月数据</button>
    </div>
    
    <div class="result">
        <h3>请求:</h3>
        <pre id="request"></pre>
        
        <h3>响应:</h3>
        <pre id="response"></pre>
    </div>

    <script>
        async function testAPI1() {
            const url = 'http://localhost:8000/api/meters?month=2026-07';
            document.getElementById('request').textContent = `GET ${url}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }

        async function testAPI2() {
            const url = 'http://localhost:8000/api/meters?month=2026-07&building_id=1';
            document.getElementById('request').textContent = `GET ${url}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }

        async function testAPI3() {
            const url = 'http://localhost:8000/api/meters?month=2026-08';
            document.getElementById('request').textContent = `GET ${url}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
