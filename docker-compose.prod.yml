version: '3.8'

# 生产环境 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.prod.yml up -d

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: dormbill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-dormbill}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dormbill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 生产环境不暴露 MySQL 端口到宿主机
    # ports:
    #   - "3306:3306"

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dormbill-backend:latest
    container_name: dormbill-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-dormbill}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      DEBUG: False
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    networks:
      - dormbill-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 生产环境不暴露后端端口，仅通过前端 Nginx 代理访问
    # ports:
    #   - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 前端 Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dormbill-frontend:latest
    container_name: dormbill-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - dormbill-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  dormbill-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
